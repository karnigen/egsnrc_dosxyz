[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "egsnrc_dosxyz"
version = "0.0.4"
description = "Read and write 3ddose and egsphant files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Tony Karnigen", email = "karnigen@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pyevtk",
]

[project.urls]
Homepage = "https://github.com/karnigen/egsnrc_dosxyz"
Issues = "https://github.com/karnigen/egsnrc_dosxyz/issues"

[dependency-groups]
dev = ["pytest>=8"]

